name: AMK Safe Ledger Archive Replacement Utility

on:
  push:
    branches:
      - build/amk-accounting-installer
    paths:
      - 'amk-build/AMK_Safe_Archive_Replacer_Source.b64'
      - '.github/workflows/amk-safe-archive-replace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-selftest:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code only
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify source and unpack
        shell: pwsh
        run: |
          $b64 = (Get-Content -Raw 'amk-build/AMK_Safe_Archive_Replacer_Source.b64').Trim()
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash 'source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '9f0299b6ef66ecae348dfe7c0d7ab05494d9b06efb54e5a181d739992bfff129') {
            throw "Source checksum mismatch: $sha"
          }
          Expand-Archive 'source.zip' '.' -Force
          if (!(Test-Path 'AMK.SafeReplace/AMK.SafeReplace.csproj')) { throw 'Missing source project' }
      - name: Build portable Windows executable
        shell: pwsh
        run: |
          dotnet restore 'AMK.SafeReplace/AMK.SafeReplace.csproj' -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet publish 'AMK.SafeReplace/AMK.SafeReplace.csproj' -c Release -r win-x64 --self-contained true -o 'published' -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          if (!(Test-Path 'published/AMK.SafeReplace.exe')) { throw 'EXE not produced' }
      - name: Verify clean replacement and dependency safety
        shell: pwsh
        run: |
          $exe=(Resolve-Path '.\published\AMK.SafeReplace.exe').Path
          $test=Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          Write-Host ('Exit code: '+$test.ExitCode)
          if ($test.ExitCode -ne 0) { Get-ChildItem -Recurse -Filter 'AMK_SelfTest_*.txt' | ForEach-Object { Write-Host ('Diagnostic: '+$_.FullName); Get-Content $_.FullName }; throw 'Migration and safeguard tests failed' }
          Write-Host 'Safety tests succeeded.'
      - name: Upload Windows executable (source only, no patient data)
        uses: actions/upload-artifact@v4
        with:
          name: AMK-SafeArchiveReplace-Windows64
          path: published/AMK.SafeReplace.exe
          retention-days: 14
          if-no-files-found: error
