name: Backend CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  DEBUG: "false"
  BOOTSTRAP_ENABLED: "true"
  SECRET_KEY: 4B-MOS-CI-only-key-not-for-production-20260905
  DATABASE_URL: sqlite:///./ci-migration.db
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate clinical console JavaScript
        if: ${{ matrix.python-version == '3.14' }}
        run: node --check backend/app/web/app.js

      - name: Verify migrations on a fresh database
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic current

      - name: Run backend test suite
        run: python -m pytest backend/tests -q

  postgresql-tests:
    name: PostgreSQL 18 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: mos_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mos_ci
      DATABASE_LOCK_TIMEOUT_MS: "250"
      TEST_POSTGRESQL_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mos_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Verify migrations on fresh PostgreSQL
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic current

      - name: Run PostgreSQL integration tests
        run: python -m pytest backend/tests/test_postgresql_integration.py -q

  container-smoke:
    name: Production container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_NAME: 4b-mos-backend:ci
      CONTAINER_NAME: 4b-mos-api-${{ github.run_id }}-${{ github.run_attempt }}
      VOLUME_NAME: 4b-mos-data-${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_DATABASE_URL: sqlite:////data/4bmos.db
      CONTAINER_SECRET_KEY: 4B-MOS-container-CI-only-key-20260917-ABCDEFGHIJKLMNOPQRSTUVWXYZ

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --pull --tag "$IMAGE_NAME" .

      - name: Migrate disposable container database
        run: |
          docker volume create "$VOLUME_NAME"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount "type=volume,source=$VOLUME_NAME,target=/data" \
            --env ENVIRONMENT=production \
            --env DEBUG=false \
            --env BOOTSTRAP_ENABLED=false \
            --env "SECRET_KEY=$CONTAINER_SECRET_KEY" \
            --env "DATABASE_URL=$CONTAINER_DATABASE_URL" \
            "$IMAGE_NAME" \
            python -m alembic upgrade head

      - name: Start hardened disposable container
        run: |
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=volume,source=$VOLUME_NAME,target=/data" \
            --publish 127.0.0.1:18000:8000 \
            --env ENVIRONMENT=production \
            --env DEBUG=false \
            --env BOOTSTRAP_ENABLED=false \
            --env "SECRET_KEY=$CONTAINER_SECRET_KEY" \
            --env "DATABASE_URL=$CONTAINER_DATABASE_URL" \
            "$IMAGE_NAME"

      - name: Verify runtime contract
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:18000/api/v1/health/ready \
              > /tmp/4bmos-ready.json; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            sleep 1
          done
          test "$ready" = "true"
          test "$(cat /tmp/4bmos-ready.json)" = '{"status":"ready"}'
          curl --fail --silent http://127.0.0.1:18000/api/v1/health > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18000/docs)" = "404"
          curl --fail --silent \
            http://127.0.0.1:18000/app/ \
            > /tmp/4bmos-console.html
          grep --fixed-strings \
            '<title>4B-MOS | جریان زنده کلینیک</title>' \
            /tmp/4bmos-console.html
          curl --fail --silent --head \
            http://127.0.0.1:18000/app/app.js \
            | grep --ignore-case --fixed-strings 'cache-control: no-store'
          test "$(docker exec "$CONTAINER_NAME" id -u)" = "10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' \
            "$CONTAINER_NAME")" = "true"
          if docker exec "$CONTAINER_NAME" touch /must-not-write 2>/dev/null; then
            echo "Container root filesystem unexpectedly accepted a write." >&2
            exit 1
          fi

      - name: Show container logs after failure
        if: ${{ failure() }}
        run: docker logs "$CONTAINER_NAME" || true

      - name: Remove disposable container resources
        if: ${{ always() }}
        run: |
          docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
          docker volume rm --force "$VOLUME_NAME" 2>/dev/null || true

  backend-ci:
    name: Backend CI
    if: ${{ always() }}
    needs:
      - backend-tests
      - postgresql-tests
      - container-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every backend test job to pass
        env:
          BACKEND_TEST_RESULT: ${{ needs.backend-tests.result }}
          POSTGRESQL_TEST_RESULT: ${{ needs.postgresql-tests.result }}
          CONTAINER_SMOKE_RESULT: ${{ needs.container-smoke.result }}
        run: |
          test "$BACKEND_TEST_RESULT" = "success"
          test "$POSTGRESQL_TEST_RESULT" = "success"
          test "$CONTAINER_SMOKE_RESULT" = "success"
