name: Backend CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  DEBUG: "false"
  BOOTSTRAP_ENABLED: "true"
  SECRET_KEY: 4B-MOS-CI-only-key-not-for-production-20260905
  DATABASE_URL: sqlite:///./ci-migration.db
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Verify migrations on a fresh database
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic current

      - name: Run backend test suite
        run: python -m pytest backend/tests -q

  backend-ci:
    name: Backend CI
    if: ${{ always() }}
    needs:
      - backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every backend test job to pass
        env:
          BACKEND_TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$BACKEND_TEST_RESULT" = "success"
