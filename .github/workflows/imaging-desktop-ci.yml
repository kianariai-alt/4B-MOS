name: Windows Imaging Desktop
on:
  pull_request:
    branches: [main, feature/synthetic-knee-3d]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imaging-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop-ui:
    name: Native Qt/VTK UI, local HTTPS and geometry tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MOS_DESKTOP_NETWORK_TEST: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -r backend/requirements-imaging-desktop.txt
      - run: python -m unittest discover -s backend/tests/imaging_desktop -v
      - run: python -m unittest discover -s backend/tests/imaging_3d -v
      - run: xvfb-run -a -s '-screen 0 1600x1100x24' python -m backend.imaging_desktop --smoke-ui /tmp/4b-desktop-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: 4B-Imaging-Desktop-UI-verification
          path: /tmp/4b-desktop-ui
          retention-days: 14
  windows:
    name: Build and verify Windows x64 application
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build portable desktop
        shell: pwsh
        run: ./windows/imaging/build.ps1 -UseCurrentPython
      - name: Test real loader on Windows
        run: python -m unittest discover -s backend/tests/imaging_desktop -v
      - name: Run packaged executable against generated DICOM
        shell: pwsh
        run: |
          $Report = Join-Path $env:RUNNER_TEMP 'imaging-core-self-test.json'
          $Proc = Start-Process -FilePath 'dist/4B-Imaging/4B-Imaging.exe' -ArgumentList @('--self-test-core', $Report) -Wait -PassThru
          if ($Proc.ExitCode -ne 0) { throw 'Packaged application self-test failed.' }
          $Result = Get-Content $Report -Raw | ConvertFrom-Json
          if ($Result.core_self_test -ne 'passed') { throw 'Missing packaged test result.' }
          Copy-Item $Report dist/4B-Imaging/synthetic-build-verification.json
          if (-not (Get-ChildItem dist/4B-Imaging -Filter QtWebEngineProcess.exe -Recurse)) { throw 'Missing embedded portal browser runtime.' }
          if (-not (Get-ChildItem dist/4B-Imaging -Filter icudtl.dat -Recurse)) { throw 'Missing browser resource bundle.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 4B-Imaging-Windows-x64
          path: dist/4B-Imaging
          retention-days: 14
