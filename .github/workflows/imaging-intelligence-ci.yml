name: Imaging Intelligence

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/imaging_intelligence/**'
      - 'backend/app/decision_intelligence/**'
      - 'backend/tests/imaging_intelligence/**'
      - 'backend/tools/imaging_metadata_demo.py'
      - 'backend/requirements-imaging.txt'
      - '.github/workflows/imaging-intelligence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-validation:
    name: Synthetic imaging and data validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install metadata-only dependency
        run: python -m pip install -r backend/requirements-imaging.txt
      - name: Run database-free synthetic tests
        run: python -m unittest discover -s backend/tests/imaging_intelligence -v
      - name: Run the local synthetic example
        run: python -m backend.tools.imaging_metadata_demo
