name: AMK Admin Password Recovery

on:
  push:
    branches:
      - build/amk-accounting-installer
    paths:
      - 'amk-recovery/**'
      - '.github/workflows/amk-password-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify and unpack recovery source
        shell: pwsh
        run: |
          $b64 = (Get-Content -Raw 'amk-recovery/AMK-Password-Recovery-Source.b64').Trim()
          [IO.File]::WriteAllBytes('AMK-Password-Recovery-Source.zip', [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash 'AMK-Password-Recovery-Source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '6fea5629210020961dcd3e11acf12c6abd6fd8f1daa81c2de5ebee143d66e2f5') {
            throw "Source integrity failure: $sha"
          }
          Expand-Archive -LiteralPath 'AMK-Password-Recovery-Source.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'AMK-Password-Recovery/AMK.PasswordRecovery.csproj')) {
            throw 'Missing recovery project'
          }
      - name: Restore and publish standalone Windows tool
        shell: pwsh
        run: |
          dotnet restore 'AMK-Password-Recovery/AMK.PasswordRecovery.csproj' -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed' }
          dotnet publish 'AMK-Password-Recovery/AMK.PasswordRecovery.csproj' -c Release -r win-x64 --self-contained true -o 'recovery-publish' -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (!(Test-Path 'recovery-publish/AMK-Password-Recovery.exe')) {
            throw 'Standalone EXE was not generated'
          }
          Get-FileHash 'recovery-publish/AMK-Password-Recovery.exe' -Algorithm SHA256
      - name: Publish recovery program
        uses: actions/upload-artifact@v4
        with:
          name: AMK-Password-Recovery-Windows64
          path: recovery-publish/AMK-Password-Recovery.exe
          retention-days: 21
          if-no-files-found: error
